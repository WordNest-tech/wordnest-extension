<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WordNest Assistant</title>
  <style>
    /* 1. Default (Warm Humanity) */
    :root, [data-color-theme="default"] {
      --bg-primary: #FFFBF5;
      --bg-secondary: #FFF8F0;
      --bg-card: #FFFFFF;
      --text-primary: #2D2A24;
      --text-secondary: #4A463E;
      --text-muted: #6B665C;
      --border-subtle: rgba(61, 57, 41, 0.12);
      --border-strong: rgba(61, 57, 41, 0.2);
      --accent-primary: #B5694A;
      --accent-primary-hover: #9A5A3F;
      --accent-success: #5E8A5B;
      --shadow: 0 4px 16px rgba(61, 57, 41, 0.08);
    }
    [data-theme="dark"], [data-theme="dark"][data-color-theme="default"] {
      --bg-primary: #1C1915;
      --bg-secondary: #252219;
      --bg-card: #2A261F;
      --text-primary: #F5F2ED;
      --text-secondary: #C9C4BB;
      --text-muted: #8F8A80;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --accent-primary: #B5694A;
      --accent-primary-hover: #D07B58;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    /* 2. Romantic Sakura */
    [data-color-theme="romantic"] {
      --bg-primary: #FFF5F7;
      --bg-secondary: #FFEBF0;
      --bg-card: #FFFFFF;
      --text-primary: #5F1A37;
      --text-secondary: #853A5A;
      --text-muted: #A36B83;
      --border-subtle: rgba(236, 72, 153, 0.12);
      --border-strong: rgba(236, 72, 153, 0.25);
      --accent-primary: #EC4899;
      --accent-primary-hover: #DB2777;
      --accent-success: #5E8A5B;
      --shadow: 0 4px 16px rgba(236, 72, 153, 0.08);
    }
    [data-theme="dark"][data-color-theme="romantic"] {
      --bg-primary: #2D121F;
      --bg-secondary: #3D1E2D;
      --bg-card: #452434;
      --text-primary: #FCE7F3;
      --text-secondary: #F472B6;
      --text-muted: #A36B83;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --accent-primary: #F472B6;
      --accent-primary-hover: #F472B6;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 3. Nature Forest */
    [data-color-theme="nature"] {
      --bg-primary: #F4F8F4;
      --bg-secondary: #E8F0E8;
      --bg-card: #FFFFFF;
      --text-primary: #2D3A30;
      --text-secondary: #435447;
      --text-muted: #6B7C6E;
      --border-subtle: rgba(74, 124, 89, 0.12);
      --border-strong: rgba(74, 124, 89, 0.22);
      --accent-primary: #4A7C59;
      --accent-primary-hover: #3C6448;
      --accent-success: #4A7C59;
      --shadow: 0 4px 16px rgba(74, 124, 89, 0.08);
    }
    [data-theme="dark"][data-color-theme="nature"] {
      --bg-primary: #17211B;
      --bg-secondary: #202D25;
      --bg-card: #28372E;
      --text-primary: #E8F0E8;
      --text-secondary: #8FB996;
      --text-muted: #6B7C6E;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --accent-primary: #8FB996;
      --accent-primary-hover: #A3CBB0;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 4. Fresh Ocean */
    [data-color-theme="ocean"] {
      --bg-primary: #F0F9FF;
      --bg-secondary: #E0F2FE;
      --bg-card: #FFFFFF;
      --text-primary: #164E63;
      --text-secondary: #0369A1;
      --text-muted: #0284C7;
      --border-subtle: rgba(14, 165, 233, 0.12);
      --border-strong: rgba(14, 165, 233, 0.25);
      --accent-primary: #0EA5E9;
      --accent-primary-hover: #0284C7;
      --accent-success: #5E8A5B;
      --shadow: 0 4px 16px rgba(14, 165, 233, 0.08);
    }
    [data-theme="dark"][data-color-theme="ocean"] {
      --bg-primary: #0B1329;
      --bg-secondary: #111C44;
      --bg-card: #1C2541;
      --text-primary: #E0F2FE;
      --text-secondary: #38BDF8;
      --text-muted: #0EA5E9;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --accent-primary: #38BDF8;
      --accent-primary-hover: #7DD3FC;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 5. Cyber Tech */
    [data-color-theme="cyber"] {
      --bg-primary: #FFF8F5;
      --bg-secondary: #FFEBE5;
      --bg-card: #FFFFFF;
      --text-primary: #2B1D12;
      --text-secondary: #6B4E3D;
      --text-muted: #8F6F5E;
      --border-subtle: rgba(255, 107, 53, 0.12);
      --border-strong: rgba(255, 107, 53, 0.25);
      --accent-primary: #FF6B35;
      --accent-primary-hover: #E0531D;
      --accent-success: #5E8A5B;
      --shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
    }
    [data-theme="dark"][data-color-theme="cyber"] {
      --bg-primary: #151515;
      --bg-secondary: #222222;
      --bg-card: #2D2D2D;
      --text-primary: #FF9F1C;
      --text-secondary: #FFD166;
      --text-muted: #A3A3A3;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --accent-primary: #FF6B35;
      --accent-primary-hover: #FF8552;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* 6. Minimalist */
    [data-color-theme="minimal"] {
      --bg-primary: #FAFAFA;
      --bg-secondary: #F5F5F5;
      --bg-card: #FFFFFF;
      --text-primary: #111111;
      --text-secondary: #444444;
      --text-muted: #888888;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.15);
      --accent-primary: #000000;
      --accent-primary-hover: #333333;
      --accent-success: #444444;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"][data-color-theme="minimal"] {
      --bg-primary: #121212;
      --bg-secondary: #1C1C1C;
      --bg-card: #252525;
      --text-primary: #FFFFFF;
      --text-secondary: #CCCCCC;
      --text-muted: #888888;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --accent-primary: #FFFFFF;
      --accent-primary-hover: #E0E0E0;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    body {
      width: 280px;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #FFFBF5;
      font-size: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .status-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .status-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C45C5C;
    }
    .dot.online {
      background: var(--accent-success);
    }
    .config-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      margin-bottom: 4px;
      display: block;
    }
    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border-strong);
      transition: .2s;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent-success);
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    .config-input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .config-input:focus {
      border-color: var(--accent-primary);
    }
    .save-btn {
      width: 100%;
      padding: 9px;
      background: var(--accent-primary);
      color: #FFFBF5;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .save-btn:hover {
      background: var(--accent-primary-hover);
    }
    .save-btn:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: center;
      line-height: 1.4;
    }
    .hint a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
    }
    .hint a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">W</div>
    <div class="title">WordNest 阅读助手</div>
  </div>

  <div class="status-card">
    <div class="status-title">账号连接状态</div>
    <div class="status-value" id="auth-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">检测中...</span>
    </div>
  </div>

  <div>
    <span class="config-label">后端网关地址</span>
    <input type="text" class="config-input" id="api-url-input" placeholder="https://wordnest.cn/api">
    
    <div class="config-row">
      <span class="config-label" style="margin: 0; font-size: 12px; font-weight: 600; color: var(--text-primary)">开启全局极速翻译侧边栏</span>
      <label class="switch">
        <input type="checkbox" id="sidebar-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <button class="save-btn" id="save-settings">保存设置</button>
  </div>

  <div class="hint">
    未登录？请访问 <a href="https://wordnest.cn" target="_blank">WordNest 官网</a> 进行登录，插件将自动完成同步。
  </div>

  <script src="popup.js"></script>
</body>
</html>
